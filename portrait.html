    // ----- Génération automatique (ne pas toucher) -----
    const conteneur = document.getElementById("conteneur");
    const img = (file, alt, cls) =>
      `<a href="${BASE}/w_1600,q_auto/${file}.jpg" class="${cls}">` +
      `<img src="${BASE}/w_800,q_auto/${file}.jpg" alt="${alt}" loading="lazy"/></a>`;

    if (MODE === "patchwork") {
      const grille = document.createElement("div");
      grille.className = "patchwork";
      SERIES.forEach(s => s.photos.forEach(([f, a]) =>
        grille.innerHTML += img(f, a, "pw-item glightbox")));
      conteneur.appendChild(grille);
    } else {
      SERIES.forEach(s => {
        const sec = document.createElement("section");
        sec.className = "serie";
        sec.innerHTML =
          `<div class="serie-info"><h2 class="serie-titre">${s.titre}</h2>` +
          `<p class="serie-credits">${s.credits}</p></div>` +
          `<div class="galerie-bande" id="${s.id}"></div>`;
        conteneur.appendChild(sec);
        document.getElementById(s.id).innerHTML =
          s.photos.map(([f, a]) => img(f, a, "glightbox")).join("");
      });
    }

  <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
  <script>
    const lightbox = GLightbox();
    document.querySelectorAll(".galerie-bande").forEach(bande => {
      bande.addEventListener("wheel", e => {
        const auBout =
          (e.deltaY > 0 && bande.scrollLeft >= bande.scrollWidth - bande.clientWidth - 1) ||
          (e.deltaY < 0 && bande.scrollLeft <= 0);
        if (auBout) return;
        e.preventDefault();
        bande.scrollLeft += e.deltaY * 1.5;
      }, { passive: false });
    });
  </script>

    sb.querySelectorAll(".sidebar-nav a").forEach(a =>
