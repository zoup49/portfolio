</head>
<body>
  <aside class="sidebar">

      <a href="index.html" class="sidebar-mobile-nom">

      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>

    </div>
    <div class="sidebar-inner">
      <div class="sidebar-nom">
        <a href="index.html">
          <span class="nom">ADRIAN GELINEAU</span>
          <span class="sous-nom">photographie argentique</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="ailleurs.html">ailleurs</a>
        <a href="chiens_et_chats.html">chiens & chats</a>
        <a href="double-exposition.html">doubles expositions</a>

      </nav>
      <a href="https://www.instagram.com/adrian_alog/" target="_blank" rel="noopener noreferrer" class="instagram-sidebar" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
  </aside>

  <main class="contenu">
    <div id="conteneur"></div>
  </main>

  <script>
    const BASE = "https://res.cloudinary.com/djrtz9zbk/image/upload";

    // PHOTOS D'ACCUEIL — modifie ici
    // dest = page de destination au clic
    // file = nom du fichier Cloudinary
    const PHOTOS = [
      { dest: "", file: "planche-contact_1_rpird7", alt: "plance contact" },
      { dest: "paysage.html", file: "double-expo_17_eeheac", alt: "paysage" },
      { dest: "double-exposition.html", file: "double-expo_18_ciggwl", alt: "Doubles expositions" },
      { dest: "portrait.html", file: "double-expo_8_w33tgs", alt: "Portrait" },
      { dest: "musique.html", file: "musique_5_trox4p", alt: "musique" },
      { dest: "eau.html", file: "eau_11_klllgp", alt: "eau" },
      { dest: "double-exposition.html", file: "double-expo_12_yia9xk", alt: "Doubles expositions" },
      // ajouter : { dest: "page.html", file: "dossier/nom_fichier", alt: "description" },
    ];

    // ----- Génération automatique (ne pas toucher) -----
    const grille = document.createElement("div");
    grille.className = "patchwork";
    PHOTOS.forEach(p => {
      // Si dest est vide : photo non cliquable, sinon lien vers la page
      if (p.dest) {
        grille.innerHTML +=
          `<a href="${p.dest}" class="pw-item">` +
          `<img src="${BASE}/w_900,q_auto/${p.file}.jpg" alt="${p.alt}" loading="lazy"/></a>`;
      } else {
        grille.innerHTML +=
          `<div class="pw-item">` +
          `<img src="${BASE}/w_900,q_auto/${p.file}.jpg" alt="${p.alt}" loading="lazy"/></div>`;
      }
    });
    document.getElementById("conteneur").appendChild(grille);
  </script>

  <script>
    const btn = document.getElementById("hamburger");
    const sb  = document.querySelector(".sidebar");
    btn.addEventListener("click", () => {
      const open = sb.classList.toggle("menu-open");
      btn.setAttribute("aria-expanded", open);
    });
    sb.querySelectorAll(".sidebar-nav a").forEach(a =>
      a.addEventListener("click", () => sb.classList.remove("menu-open"))
    );
  </script>

</body>
